[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paperread-sync"
version = "0.2.0"
description = "Offline-first paper reading ledger with independently verified WeRead statistics"
requires-python = ">=3.11"
dependencies = ["typer==0.16.0", "click==8.2.1", "httpx==0.28.1", "pydantic==2.12.3", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
web = ["fastapi>=0.120,<1", "uvicorn>=0.38,<1", "jinja2>=3.1.6,<4"]
browser = ["playwright>=1.48,<2"]

[project.scripts]
paperread = "paperread.cli:run"

[tool.setuptools.packages.find]
include = ["paperread*"]

[tool.setuptools.package-data]
paperread = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
